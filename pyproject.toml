[project]
name = "hands-free"
version = "0.0.0"
description = "Hands-free voice for a fleet of Claude Code sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DanBoringName" }]
requires-python = ">=3.12"
dependencies = [
    # The kill test's audio analysis: gaps and the band edge of a recording.
    "numpy>=2.5",
]

[project.scripts]
hands-free = "hands_free.cli:main"

# uv's own backend, on the same minor line as the uv in `.tool-versions`, so the two
# move together by hand.
[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    # Reads `.pre-commit-config.yaml` in the hook tests.
    "pyyaml>=6.0",
    "ruff>=0.17",
    "ty>=0.0.92",
]

# The root is the `hands_free` package in `src/`, which arrived with Phase 0's kill test,
# the first phase that needed code (ADR-2026-11-03-repository-gate). It also holds the
# development environment and the repository's own checks.
[tool.uv]
# The oldest uv checked against the relative `exclude-newer` below.
required-version = ">=0.11.15"
# A version reaches the lock once it has been on the index for seven days, whether by
# hand or through Dependabot, whose cooldown matches (ADR-2026-11-03-repository-gate).
exclude-newer = "7 days"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PT",   # flake8-pytest-style
    "PIE",  # flake8-pie
    "TID",  # flake8-tidy-imports
    "PERF", # perflint
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit, since spoken words end up as commands
    "D",    # pydocstyle, docstrings on everything outside the tests
]
ignore = [
    # Constructors are documented at the class level, so an `__init__` docstring would
    # repeat the class's.
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves by name, assert by design and drive git directly.
"tests/**" = ["D", "S101", "S603", "S607"]
# The append-only check runs git with fixed arguments, found on `PATH`.
"protected_files.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# `pytest --cov` measures these and enforces the floor, locally and in CI alike
# (ADR-2026-11-03-repository-gate).
[tool.coverage.run]
source = ["protected_files", "hands_free"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
