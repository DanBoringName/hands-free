; The room the phone joins (ADR-2026-11-03-voice-room-switchboard), for Murmur 1.5.
;
; `hands-free murmur` adds `database` and `serverpassword` and runs Murmur from the
; result, so neither is tracked. A relative path here is relative to that copy, which
; sits in the state directory with the database.

port=64738

; No `host`, so Murmur listens on every address this machine has. Under WSL's mirrored
; networking those are the Windows host's, which is how the phone reaches the room on
; the home network. Phase 5 narrows this to the tailnet.

; Opus for every client, never the older CELT codecs.
opusthreshold=0

; The room has a phone, the switchboard and a recording client in it.
users=10

; Nothing outside the room learns the room exists or what runs it.
registerName=
bonjour=false
allowping=false
sendversion=false

; No remote administration. Ubuntu's 1.5.517 opens no Ice port with this left unset
; either, but saying so here means a build with a different default can't open one.
ice=""

welcometext=""

; Seconds of silence from a client before Murmur closes its connection and logs
; `Timeout`. A phone whose app the system has put to sleep shows up this way.
timeout=30
